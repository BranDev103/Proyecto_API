<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="icon" href="/img/icono.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>ViewFlex</title>
  </head>
  <body>
    <header>
      <img src="/img/logo.png" alt="Logo" class="logo" id="logo" />
      <nav>
        <a href="">Home</a>
        <a href="">Peliculas</a>
        <a href="">Series</a>
        <a href="">Favoritos</a>
      </nav>
    </header>

    <section class="carousel">
      <div id="carouselExampleFade" class="carousel slide carousel-fade">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="/img/carou_1.webp" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="/img/carou_1.webp" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="..." class="d-block w-100" alt="..." />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleFade"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleFade"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </section>

    <div class="busqueda" id="busqueda">
      <input
        type="text"
        id="search_input"
        placeholder="Buscar película o serie"
      />
      <button class="search_button">Buscar</button>
    </div>

    <section class="section_pelis">
      <div class="catalogo_peliculas" id="catalogo_peliculas"></div>
    </section>

    <section class="section_series">
      <div class="catalogo_series" id="catalogo_series"></div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>

  <footer></footer>
</html>
